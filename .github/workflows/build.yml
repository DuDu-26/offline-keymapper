name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Gradle (retry on network errors)
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $attempt), retrying"; sleep $((attempt * 15))
          done
          exit 1
      - name: Trajectory tests
        run: ./scripts/test-trajectory.sh
      - name: Build debug APK and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: offline-mapper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
