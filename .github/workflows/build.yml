name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Download Gradle (retry on network errors)
        run: |
          for attempt in 1 2 3; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (attempt $attempt), retrying"; sleep $((attempt * 15))
          done
          exit 1
      - name: Trajectory tests
        run: ./scripts/test-trajectory.sh
      - name: Build debug APK and lint
        run: ./gradlew :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: offline-mapper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-for-screenshots
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk-for-screenshots
          path: app/build/outputs/apk/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture UI screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./scripts/ui-screenshots.sh build/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/screenshots/*.png
