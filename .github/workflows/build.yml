name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Gradle (curl with retries; the wrapper download is flaky)
        run: |
          VERSION=$(sed -n 's/.*gradle-\([0-9.]*\)-bin.zip/\1/p' gradle/wrapper/gradle-wrapper.properties)
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 30 \
            -o "$RUNNER_TEMP/gradle.zip" "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP/ci-gradle"
          echo "$RUNNER_TEMP/ci-gradle/gradle-$VERSION/bin" >> "$GITHUB_PATH"
      - name: Trajectory tests
        run: ./scripts/test-trajectory.sh
      - name: Build debug APK and lint
        run: gradle :app:assembleDebug :app:lintDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: offline-mapper-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk-for-screenshots
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk-for-screenshots
          path: app/build/outputs/apk/debug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture UI screenshots on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./scripts/ui-screenshots.sh build/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: build/screenshots/*.png
      - name: Commit screenshots to the PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          mkdir -p docs/screenshots
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          for f in sorted(glob.glob("build/screenshots/*.png")):
              im = Image.open(f).convert("RGB")
              im.thumbnail((720, 1600))
              im.save("docs/screenshots/" + os.path.basename(f)[:-4] + ".jpg", "JPEG", quality=82)
          PY
          git add docs/screenshots
          if git diff --cached --quiet; then echo "No screenshot changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Update UI screenshots [skip ci]"
          git push origin "HEAD:${{ github.head_ref }}"
